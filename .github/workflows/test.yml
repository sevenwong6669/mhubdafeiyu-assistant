name: tests
on: [push, pull_request]
jobs:
  panel-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - working-directory: mhub-community-assistant
        run: node --test --test-concurrency=4 tests/*.test.mjs
