<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和大肥鱼说话</title>
<style>body{font:18px system-ui;background:#101b2d;color:#e7f3ff;max-width:680px;margin:50px auto;padding:24px}h1{font-size:30px}button,textarea,select{font:inherit;border-radius:14px;padding:14px;border:0;margin:8px 0;width:100%;box-sizing:border-box}button{background:#78c9ff;color:#10223a;cursor:pointer;touch-action:none}#hold{height:110px;font-size:26px}#hold.on{background:#ffa38c}p{line-height:1.7}#error{color:#ffb4a0}small{color:#aac0d7}textarea{background:#263950;color:white}</style>
<h1>和大肥鱼说话 🐟</h1><p id="status">连接中…</p><select id="mic"><option>点击下方按钮授权麦克风</option></select><button id="hold">按住说话</button><button id="stop">打断回复</button><small>按住按钮录音，松开发送。录音只在本机识别，最长60秒。</small><p id="error"></p><textarea id="text" rows="2" placeholder="也可以输入文字试聊"></textarea><button id="send">发送文字</button><p>你：<span id="input"></span></p><p>大肥鱼：<span id="reply"></span></p>
<script>
const $=id=>document.getElementById(id);let ctx,stream,node,source,samples=[],recording=false,starting=false,released=false,timer;
const choose=document.createElement('button');choose.textContent='首次使用：启用并选择麦克风';$('mic').before(choose);choose.onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true,video:false});s.getTracks().forEach(t=>t.stop());await devices();choose.textContent='重新选择麦克风';}catch(e){error(e);}};
async function post(path,body){const r=await fetch(path,{method:'POST',headers:body instanceof ArrayBuffer?{}:{'Content-Type':'application/json'},body:body instanceof ArrayBuffer?body:JSON.stringify(body||{})});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
function error(e){$('error').textContent=e.message;}
async function devices(){const list=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');const old=$('mic').value;$('mic').replaceChildren(...list.map(d=>new Option(d.label||'麦克风',d.deviceId)));const preferred=list.find(d=>/MCHOSE V9/i.test(d.label));if(list.some(d=>d.deviceId===old))$('mic').value=old;else if(preferred)$('mic').value=preferred.deviceId;}
async function start(){if(recording||starting)return;starting=true;released=false;try{await post('/interrupt');let id=$('mic').value;stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:id&&id!=='点击下方按钮授权麦克风'?{exact:id}:undefined,echoCancellation:false,noiseSuppression:true},video:false});await devices();if(released){stream.getTracks().forEach(t=>t.stop());return;}ctx=new AudioContext({sampleRate:16000});await ctx.resume();source=ctx.createMediaStreamSource(stream);node=ctx.createScriptProcessor(4096,1,1);samples=[];node.onaudioprocess=e=>{if(recording)samples.push(new Float32Array(e.inputBuffer.getChannelData(0)));};source.connect(node);node.connect(ctx.destination);recording=true;$('hold').classList.add('on');$('hold').textContent='正在听，松开发送';timer=setTimeout(end,60000);}catch(e){error(e);}finally{starting=false;}}
async function end(){released=true;if(!recording)return;recording=false;clearTimeout(timer);$('hold').classList.remove('on');$('hold').textContent='按住说话';node.disconnect();source.disconnect();stream.getTracks().forEach(t=>t.stop());const rate=ctx.sampleRate;await ctx.close();const n=samples.reduce((s,a)=>s+a.length,0);if(n<rate*.25)return;const wav=new ArrayBuffer(44+n*2),v=new DataView(wav);function str(at,s){[...s].forEach((c,i)=>v.setUint8(at+i,c.charCodeAt(0)));}str(0,'RIFF');v.setUint32(4,36+n*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*2,true);let at=44;for(const a of samples)for(const x of a){v.setInt16(at,Math.max(-1,Math.min(1,x))*32767,true);at+=2;}try{const result=await post('/recognize',wav);if(result.text){$('text').value=result.text;await send();}else throw Error('没有识别到文字，请再试一次');}catch(e){error(e);}}
async function send(){try{await post('/speak',{text:$('text').value});$('text').value='';}catch(e){error(e);}}
$('hold').onpointerdown=e=>{e.preventDefault();$('hold').setPointerCapture(e.pointerId);start();};$('hold').onpointerup=end;$('hold').onpointercancel=end;window.addEventListener('blur',()=>{if(recording)end();});$('stop').onclick=()=>post('/interrupt').catch(error);$('send').onclick=send;setInterval(async()=>{try{const s=await(await fetch('/status')).json();$('status').textContent=s.phase+(s.streamReady?'':' · 等待 Harness 语音接线');$('input').textContent=s.input;$('reply').textContent=s.reply;if(s.error)$('error').textContent=s.error;$('hold').disabled=!s.ready||!s.streamReady;}catch(e){$('status').textContent='语音服务未启动';}},500);
</script>
